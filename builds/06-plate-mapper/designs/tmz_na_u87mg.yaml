# builds/06-plate-mapper/designs/tmz_na_u87mg.yaml
design_id: TMZ-NA-U87-001
cell_line: U87MG
rrid: CVCL_0022               # cell line identifier, not just a name
seeding_density: 5000         # cells per well
plate_format: 96

axes:
  drug_a:
    name: temozolomide
    top_conc_uM: 800
    dilution_factor: 2
    n_steps: 6
  drug_b:
    name: nanaomycin_A
    top_conc_uM: 10
    dilution_factor: 2
    n_steps: 10

controls:
  vehicle: { wells: 4, solvent: DMSO, final_pct: 0.5 }
  untreated: { wells: 4 }
  blank: { wells: 4 }

edge_policy: exclude_perimeter
replicates: 3
randomise_within_plate: true

analysis:
  synergy_model: bliss
  justification: >
    The two agents act through distinct mechanisms, so the multiplicative
    survival assumption is defensible. Loewe is not appropriate here
    because it assumes a shared dose-equivalence relationship.
  committed_at: 2026-03-14T09:20:00+05:30
