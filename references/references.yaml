    note: >
      Appendix D reads "Silent failure and data consistency decay in
      multi-agent pipelines (2026)". Both halves of that description are
      names inside this paper rather than a paraphrase of it: "Data
      Consistency Decay (L3 - Execution)" is a row in its failure taxonomy,
      described as gradual divergence between recorded and actual state in
      agent-managed data pipelines where every step runs correctly and the
      aggregate is systematically wrong, and it tabulates consistency falling
      from 100 per cent at one hop to 23.5 per cent at ten. Submitted 6 June
      2026. No DOI, arXiv only.
      Read the abstract alone and you would not find either phrase, which is
      why an earlier pass could not resolve this; they are in the body. Treat
      the surrounding claims with more caution than the other entries here:
      single author, an entropy model S(t) = S0 e^(alpha t) offered as a
      principle, and a claimed 40,000 controlled trials that nothing
      independent has reproduced. It is a preprint making a strong general
      claim, and the honest way to cite it in Chapter 5 is for the failure
      mode it names, not for the law it proposes.

