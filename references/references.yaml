# references.yaml
#
# The machine-readable source for Appendix D. tools/verify_references.py
# resolves every entry against Crossref and fails a build if any entry is a
# mismatch or unresolved.
#
# Entries verified by hand and carrying a DOI are marked verified: true. The
# rest need the script run against them before print.
#
# TWO PROSE FIELDS, AND THEY GO TO DIFFERENT PLACES.
#
# gloss:  reader-facing. This is what prints in Appendix D after the
#         bibliographic record, and it is the only prose here that a reader
#         ever sees. Write it for them.
# note:   maintenance. How the entry was resolved, what was checked against
#         what, what is still open, what the next person must not do. NEVER
#         PRINTS. These notes say things like "THE ENTRY IS STALE AND THE FIX
#         IS NOT MINE TO MAKE", which would be a catastrophe in a book.
#
# The two lived in one field until this pass, which was a live hazard: the
# moment anyone drafts appendix text by copying from here, the scaffolding
# ships with it.
#
# kind: article | preprint | book | report | standard | regulation |
#       documentation | dataset | benchmark | unsourced
# Entries whose kind is standard, regulation, documentation, dataset or report
# are skipped by the Crossref check and verified by URL instead, as are books
# that carry no DOI, because a pre-DOI book has no Crossref record and a title
# search on one manufactures a mismatch. That is a decision, recorded rather
# than left implicit.

