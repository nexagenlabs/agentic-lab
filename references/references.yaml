  # properly or the claims must be softened before print.

  - id: mas_vs_sas_2025
    chapter: 12
    kind: preprint
    title: "Single-agent or Multi-agent Systems? Why Not Both?"
    authors: "Gao, M., Li, Y., Liu, B., Yu, Y., Wang, P., Lin, C.-Y. and Lai, F."
    venue: "arXiv"
    arxiv: "2505.18286"
    year: 2025
    verified: true
    note: >
      THE PRINTED APPENDIX IS STALE HERE, and this is the manifest test's
      failure running in the opposite direction: references.yaml was resolved
      and the printed page was not. Appendix D entry 67 still reads "Token
      consumption in multi-agent versus single-agent systems. University of
      Illinois Urbana-Champaign (2026)", a description of a finding, where
      this entry has carried the resolved paper for two passes: arXiv
      2505.18286, "Single-agent or Multi-agent Systems? Why Not Both?", 2025.
      The printed year is wrong as well as the title. Update the appendix from
      this entry, not the other way round.
      Source of the four to two hundred and twenty times figure. Two
      corrections came out of resolving it. The range is for INPUT, prefill
      tokens across seven datasets, not tokens in general, and Chapter 12 said
      tokens without qualification until this pass. The paper also reports a
      second figure the chapter had missed and now carries: assuming perfect
      context reuse, the multi-agent configuration still needs two to twelve
      times more tokens for response generation. That is the floor that
      survives optimisation and it is the number to budget against.

