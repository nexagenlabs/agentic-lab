    doi: "10.1038/s41586-025-09992-y"
    verified: true
    note: >
      The correction states that concerns were raised about the unambiguous
      identification of compound structures by diffraction and about the
      original claims of material novelty, and that the novelty claims were
      intended to mean new to the prediction platform rather than new to
      science. The tool skips titles beginning "Author Correction" when
      searching, so this entry is resolved by DOI.

