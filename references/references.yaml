    note: >
      The CVE is real and the URL resolves. The vendor advisory is
      GHSA-82wg-qcm4-fp2w, titled "Terminal Tool Allowlist Bypass via
      Environment Variables": in Cursor before 2.3, shell built-ins such as
      export and unset ran in Auto-Run allowlist mode without appearing in the
      allowlist, so prompt injection could poison PATH or LD_PRELOAD and turn
      an already-approved command into arbitrary execution. This entry's title
      says "an agentic coding assistant" where the record names Cursor. That
      is a description standing in for a title, which is the exact shape the
      reviewer objected to. Naming the product is the author's call.

