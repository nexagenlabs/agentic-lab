      Appendix D reads "Evaluation of large language model agreement with human
      screeners across six systematic reviews in software engineering (2026)".
      Resolved on the finding, submitted 16 June 2026: six software
      engineering systematic reviews, over 1,000 primary studies, screened
      independently by human experts and by LLMs zero-shot, Cohen's kappa from
      0.52 to 0.77. No DOI, for the arXiv and DataCite reason recorded on
      ghostcite2026.
      One near neighbour was checked and ruled out rather than assumed:
      "Beyond Accuracy: LLM Variability in Evidence Screening for Software
      Engineering SLRs", arXiv 2604.27006, carries software engineering in its
      title but covers two reviews, not six, and benchmarks against classical
      classifiers rather than against human screeners.
      Worth noting for Chapter 4: 0.52 to 0.77 straddles the boundary between
      moderate and substantial in the Landis and Koch bands this book cites at
      landis1977kappa, and the screening task is exactly the class-imbalanced
      setting byrt1993pabak and gwet2008ac1 are in the list to warn about. The
      kappa range and the prevalence warning belong in the same sentence.

