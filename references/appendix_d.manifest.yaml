# appendix_d.manifest.yaml
#
# What Appendix D of the manuscript actually contains, recorded here because
# the manuscript is not in this repository and nothing else in the build can
# see it.
#
# This file exists because of a specific failure. references.yaml was seeded by
# hand and never reconciled against the appendix. The appendix carried 74
# entries; references.yaml carried 47. tools/verify_references.py reported
# green across three passes and a reviewer read the result as a statement about
# the printed book, which it was not: it was a statement about the 47 entries
# the tool could see. A verification gate pointed at the wrong list is worse
# than no gate, because it buys confidence it has not earned.
#
# tests/test_appendix_d_manifest.py holds references.yaml and this file to the
# same list. Edit this file when Appendix D changes, and edit it FROM THE
# APPENDIX, not from references.yaml, or the two will agree with each other
# about something neither has checked.
#
# count       the number of entries in the printed Appendix D, counted by hand.
#             It is stated separately from the list on purpose. If it were
#             derived from the list, a whole row could be dropped from both at
#             once and nothing would notice; stated separately, the count is an
#             independent witness and the test fails until the list matches it.
# entries[].id      must correspond one-for-one with an id in references.yaml.
# entries[].phrase  a short identifying phrase from the appendix entry, enough
#             to find it on the printed page by eye. The test requires the
#             phrase to appear in that entry's id, title or note in
#             references.yaml, so an entry cannot be resolved from a
#             description to a real paper without recording what the appendix
#             itself says. That is the trail a reviewer follows.
#
# KNOWN GAP: count is 74 and only 69 entries are transcribed below, so
# tests/test_appendix_d_manifest.py FAILS on purpose. Five appendix entries are
# unaccounted for: the twenty-two recovered in the reconciliation pass were
# listed by hand, and 47 + 22 is 69, not 74. Either five more entries are in the
# printed appendix and have never been seen by this repository, or the count of
# 74 is wrong, or references.yaml holds entries the appendix does not. Only the
# printed page settles it. Do not "fix" this by editing count down to 69.

