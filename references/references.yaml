  # ---------------- Chapter 12 ----------------
  #
  # These three are the weakest entries in the whole list and they are marked
  # so deliberately. Each is currently a description of a finding rather than
  # a citation of a work: the chapter quotes a number, and the entry names
  # roughly where the number came from. None can be resolved by any script,
  # because none names a title or an author. They must either be sourced
  # properly or the claims must be softened before print.

  - id: mas_vs_sas_2025
    chapter: 12
    kind: preprint
    title: "Single-agent or Multi-agent Systems? Why Not Both?"
    venue: "arXiv"
    arxiv: "2505.18286"
    year: 2025
    verified: true
    note: >
      Source of the four to two hundred and twenty times figure. Two
      corrections came out of resolving it. The range is for INPUT, prefill
      tokens across seven datasets, not tokens in general, and Chapter 12 said
      tokens without qualification until this pass. The paper also reports a
      second figure the chapter had missed and now carries: assuming perfect
      context reuse, the multi-agent configuration still needs two to twelve
      times more tokens for response generation. That is the floor that
      survives optimisation and it is the number to budget against.

  - id: practitioner2026_coordination
    chapter: 12
    kind: unsourced
    title: "Orchestration overhead and coordination cost in production agent pipelines"
    year: 2026
    verified: false
    note: >
      STILL UNSOURCED, and the chapter has been changed rather than left to
      rest on it. The specific figures of 950 milliseconds against 500 and
      29,000 tokens against 10,000 have been removed from Chapter 12. What
      remains is the shape of the finding, attributed as practitioner
      experience rather than measurement, and the eighty per cent claim is now
      explicitly labelled as one team's report. If a stable source is found,
      the numbers can return; until then the softened text stands and this
      entry stays UNSOURCED so the gate keeps failing.

  - id: clinical_scale_orchestration_2025
    chapter: 12
    kind: preprint
    title: "Orchestrated multi agents sustain accuracy under clinical-scale workloads compared to a single agent"
    venue: "medRxiv"
    doi: "10.1101/2025.08.22.25334049"
    year: 2025
    verified: true
    note: >
      The chapter's counter-evidence, and the strongest argument against its
      own thesis, so it needed a resolvable source most of all. Batch sizes
      from 5 to 80 across retrieval, extraction and dosing tasks. Confirm the
      exact token and latency figures against the paper before print; the
      chapter quotes several.

