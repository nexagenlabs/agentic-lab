# ================= Appendix D reconciliation, added in this pass =================
#
# references.yaml was seeded by hand and never reconciled against Appendix D.
# The appendix carries 74 entries; this file held 47. The twenty-two below were
# in the printed book and had never been checked by anything.
#
# Every DOI here was resolved against Crossref before it was written, and the
# title, authors, venue, volume, pages and year of each resolved entry were
# taken from that Crossref record rather than from recall. Where the appendix
# gives a description instead of a title, the description is preserved verbatim
# in the entry note, both so the resolution can be audited against the printed
# page and so tests/test_appendix_d_manifest.py can anchor the entry to it.

