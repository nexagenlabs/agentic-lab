# on_ambiguity is misspelled. Without extra=forbid this file loads, the
# misspelled key is ignored, and the run screens with a policy the author
# believed they had written. That is the failure this fixture exists for.
version: 3
question: >
  Does this record report a measured cytotoxicity or viability endpoint
  for an approved drug in a liver-derived human cell model?

include_if_all:
  - id: numeric_endpoint
    text: Reports a numerical IC50, EC50 or percentage viability.

exclude_if_any:
  - id: review
    text: Review, editorial, commentary or conference abstract.

on_ambiguity: flag
on_ambiguty: exclude
