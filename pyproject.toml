# Repository-wide tool configuration.
#
# The builds are not a package. Each one is a folder a reader can open on its
# own, and several of them deliberately carry files of the same name, such as
# agent.py and config.py. That is good for a reader and awkward for pytest,
# which is what the import mode below is here to settle.

[tool.pytest.ini_options]
# Import test modules by their full path rather than by prepending their
# directory to sys.path, so two builds may both hold a tests/conftest.py and
# a module of the same name without one shadowing the other.
addopts = "--import-mode=importlib"
testpaths = ["tests", "builds"]

[tool.ruff.lint]
# Ban imports inside function bodies. This is not a style preference. Builds
# deliberately share module names, so a bare `import models` resolves to
# whichever build is importable at the moment it runs, and a function-body
# import runs long after collection, when that is no longer the build the test
# belongs to. That resolved to the wrong build three times before the root
# conftest.py fixed it, and each time the fix was the same and the next
# occurrence was already being written. This catches the shape rather than the
# aftermath.
#
# extend-select rather than select, so the rest of the default rule set stays
# whatever the installed ruff considers default.
extend-select = ["PLC0415"]
