# appendix_d.manifest.yaml
#
# What Appendix D of the manuscript actually contains. Transcribed from
# references/APPENDIX_D_AS_PRINTED.md, which is the authoritative extract of
# the printed page.
#
# This file exists because of a specific failure. references.yaml was seeded by
# hand and never reconciled against the appendix. The appendix carried 74
# printed rows; references.yaml carried 47. tools/verify_references.py reported
# green across three passes, and that green was read as a statement about the
# printed book. It was not: it was a statement about the 47 entries the tool
# could see. A verification gate aimed at the wrong list is worse than no gate,
# because a missing gate leaves you uncertain and a misaimed one sells you
# confidence it has not earned.
#
# 74 printed rows describe 73 distinct works, because entries 8 and 63 are the
# same document, printed once in Chapter 1 and again in Chapter 11. That is
# recorded rather than silently collapsed: the printed page really does have 74
# numbered rows, and a manifest that quietly held 73 would disagree with
# anybody counting the book.
#
# tests/test_appendix_d_manifest.py holds references.yaml and this file to the
# same list. Edit this file FROM THE PRINTED APPENDIX, never from
# references.yaml, or the two will agree with each other about something
# neither has checked.
#
# count         printed rows in Appendix D, counted by hand. Stated separately
#               from the list on purpose: derived from it, a row dropped from
#               both at once would pass unnoticed, and that is exactly the bug
#               this file was written for.
# entries[].n   the printed entry number. Asserted contiguous from 1 to count,
#               which is a second independent witness against a lost row.
# entries[].id  must correspond to an id in references.yaml.
# entries[].phrase
#               a short identifying fragment of the printed row, enough to find
#               it on the page by eye. The test requires it to appear in that
#               entry's id, title or note, so an entry cannot be resolved from
#               a description into a real paper without recording what the
#               appendix itself says.
# entries[].printed_as
#               "description" where the printed row still gives a description
#               of a finding instead of a bibliographic citation. Those rows
#               carry no title or author to check, so tools/appendix_render.py
#               checks no fields on them and counts them instead. Run
#               `python tools/appendix_render.py --emit` to get the string that
#               turns one into a citation.
# entries[].omits
#               fields the printed row deliberately does not carry. The house
#               style prints a DOI on some rows and not others, omits pages on
#               a working paper, and dates no documentation. Omission is an
#               editorial choice; contradiction is the error. Naming the
#               omitted field keeps the choice explicit instead of relaxing the
#               check for everybody.
# entries[].duplicate_of
#               present only where the appendix prints the same work twice.
#               Names the earlier printed number. Such a row shares its id, and
#               is exempt from the id-uniqueness and chapter checks.

