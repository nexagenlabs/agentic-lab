# Stack inventory for Build 02-tool-belt, emitted by stack.py.
# Chapter 2 of The Agentic Lab. Regenerate rather than edit.
build: "02-tool-belt"
chapter: 3
stack_inventory:
  model:
    question: "Which model answers, at which version, and where is that name configured?"
    value: "claude-sonnet-5"
    note: "AGENT_MODEL, defaulted in config.py and named nowhere else in this build."
  tools:
    question: "What can it call, and what can each of those reach?"
    value: "search_pubmed, fetch_abstract"
    note: "declared as plain JSON schema in dispatch.py, and every argument is validated with Pydantic before the function body runs."
  working_memory:
    question: "What does the loop carry from one step to the next, and what bounds it?"
    value: "one messages list per run, bounded at 20 steps and 100000 tokens"
    note: "the budget is checked before the model call rather than after, because a budget checked afterwards has already been spent."
  episodic_memory:
    question: "What survives after the run ends, and who can read it back?"
    value: "none: WRITE_TOOLS is empty, so this build writes nothing a later run could read"
    note: "deliberate. The tool belt is about the dispatch boundary, not about persistence."
  reference_memory:
    question: "What does it consult that it cannot change?"
    value: "the stub corpus in fixtures/, which the tools read"
    note: "read-only."
  orchestration:
    question: "What decides the next step: the model, or the code?"
    value: "agent loop, one model call per turn, a tool disabled after 3 consecutive failures"
    note: "the loop is ordinary code; the model chooses only which tool comes next."
  trace:
    question: "Where does the record of the run go, and what does it hold?"
    value: "JSONL, one event per line, runs/<run_id>.jsonl"
    note: "tracing.Trace, copied from Build 01 rather than imported from it."
